<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magna EduSite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#f7f4f3;--surface:#ffffff;--ink:#1a1415;--muted:#6f6567;--line:#e9e2e0;
  --red:#a31515;--red-d:#7d0f0f;--red-soft:#fbeaea;
  --green:#17803d;--green-soft:#e5f5ea;--amber:#b45309;--amber-soft:#fef3e2;--blue:#1d4ed8;--blue-soft:#e8effe;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141011;--surface:#1e1819;--ink:#f4eeee;--muted:#a89c9e;--line:#342b2c;
    --red:#e86a6a;--red-d:#c94b4b;--red-soft:#3a1b1c;--green:#4ade80;--green-soft:#12301d;--amber:#fbbf24;--amber-soft:#35280f;--blue:#8ab0ff;--blue-soft:#172a4d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141011;--surface:#1e1819;--ink:#f4eeee;--muted:#a89c9e;--line:#342b2c;
  --red:#e86a6a;--red-d:#c94b4b;--red-soft:#3a1b1c;--green:#4ade80;--green-soft:#12301d;--amber:#fbbf24;--amber-soft:#35280f;--blue:#8ab0ff;--blue-soft:#172a4d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 Mulish,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:Montserrat,sans-serif;margin:0}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h2{font-size:16px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{font:700 17px Montserrat,sans-serif;display:flex;align-items:center;gap:10px}
.brand img.lg{height:30px;width:auto;background:#0b0c26;padding:6px 10px;border-radius:10px;box-sizing:content-box}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}
.who{display:flex;align-items:center;gap:8px}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.shell{display:flex;max-width:1280px;margin:0 auto}
.side{width:220px;flex:none;padding:18px 12px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:flex-start}
.side a{display:block;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:2px}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--red-soft);color:var(--red)}
.page{flex:1;min-width:0;padding:22px 22px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.stp:last-child{border-bottom:0}.stp b{flex:1;min-width:140px}
.qq{margin:0 0 16px}.qq p{font-weight:700;margin:0 0 8px}.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}.opt input{margin-top:3px}
.rate{display:flex;gap:8px;flex-wrap:wrap}.rate button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.rate button.on{background:linear-gradient(135deg,#2f6bf0,#7c3aed);border-color:transparent;color:#fff}.rate button:focus-visible{outline:3px solid var(--hi,#c9b8ff);outline-offset:2px}
.qe{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.qe textarea,.qe input[type=text]{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit;font:inherit}.qe .oo{display:flex;gap:8px;align-items:center;margin-top:8px}.qe .oo input[type=text]{margin-top:0}
.m small{color:var(--muted);display:block;font-weight:600}
.m b{font:700 26px Montserrat,sans-serif;display:block;margin:2px 0 6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--red)}
.bar.g i{background:var(--green)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-g{background:var(--green-soft);color:var(--green)}.p-a{background:var(--amber-soft);color:var(--amber)}.p-r{background:var(--red-soft);color:var(--red)}.p-b{background:var(--blue-soft);color:var(--blue)}.p-n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:var(--red-d)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--bg)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.row:hover{border-color:var(--red)}
.row .g{flex:1;min-width:0}.row small{color:var(--muted)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-weight:800;flex:none}
.ico.ok{background:var(--green-soft);color:var(--green)}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0}
.chk input{width:17px;height:17px;accent-color:var(--red)}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
ul.d{margin:6px 0 0;padding-left:20px}ul.d li{margin-bottom:4px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:16px}
.lock{background:var(--red-soft);color:var(--red);border-radius:10px;padding:14px;font-weight:700;text-align:center}
.ok{background:var(--green-soft);color:var(--green);border-radius:10px;padding:14px;font-weight:700;text-align:center}
.ph{margin-bottom:18px}.ph h2{margin-bottom:8px}
.td{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.td:last-child{border:0}
.td input{width:18px;height:18px;margin-top:3px;accent-color:var(--red);flex:none}
.td.done span{color:var(--muted);text-decoration:line-through}
.vt{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#3a1b1c,#a31515);text-decoration:none}
.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt .pl{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,0,0,.65);z-index:1}
.vt .pl::before{content:"";position:absolute;left:21px;top:16px;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #fff}
.vt .cap{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.85);z-index:1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:0;pointer-events:none}
.vt .bd{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;z-index:1}
.vt.sm{width:132px;flex:none;border-radius:8px}
.vt.sm .pl{transform:scale(.55)}
.vt.sm .cap{display:none}
.pt{padding-left:20px;margin:8px 0 0}.pt li{margin-bottom:16px}
.vt.kr{background:linear-gradient(135deg,#1e293b,#475569)}
.vt .kt{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:6px;line-height:1.3}
.xr{display:flex;gap:12px;align-items:center;color:var(--ink);font-weight:700;text-decoration:none;margin-top:10px}
.xr:hover span:last-child{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a1415;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (max-width:900px){
  .grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
  .shell{display:block}.side{width:auto;position:static;display:flex;overflow-x:auto;padding:10px 14px 0;gap:4px}
  .side a{white-space:nowrap;margin:0}.page{padding:16px 14px 60px}.seg{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.sc:hover{border-color:var(--red)}
.sc .vt{border-radius:0}
.sc .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.sc h3{font-size:15px;font-weight:600}
.sc small{color:var(--muted)}
.secc .b{padding:16px 16px 18px;gap:8px}.secc h3{font-size:17px}.secc .bar{margin-top:4px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alt{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.alt:last-child{border:0}
.alt a{color:var(--red);font-weight:700;text-decoration:none}
/* Magna theme: ungu, magenta, navy gelap (diperkirakan dari feed Instagram) */
:root{--bg:#f5f1fb;--surface:#ffffff;--ink:#1b1033;--muted:#6b5f86;--line:#e2d9f2;--red:#c0227a;--red-d:#9b1b63;--red-soft:#f9e6f2;--blue:#6d28d9;--blue-soft:#ece4fb;--amber:#a85a00;--amber-soft:#fdf0d5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0820;--surface:#1a1233;--ink:#f5f0ff;--muted:#b3a6d1;--line:#33265a;--red:#ff7ab8;--red-d:#ff5fa8;--red-soft:#3a1240;--blue:#b79bff;--blue-soft:#2a1d55;--amber:#ffc857;--amber-soft:#3a2c10}}
:root[data-theme="dark"]{--bg:#0d0820;--surface:#1a1233;--ink:#f5f0ff;--muted:#b3a6d1;--line:#33265a;--red:#ff7ab8;--red-d:#ff5fa8;--red-soft:#3a1240;--blue:#b79bff;--blue-soft:#2a1d55;--amber:#ffc857;--amber-soft:#3a2c10}
.btn,.btn:hover,.seg button.on{background:linear-gradient(90deg,#6d28d9,#c0227a);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.line,.btn.line:hover{background:var(--surface);color:var(--ink)}
.btn.line:hover{background:var(--bg)}
.brand i{background:linear-gradient(135deg,#6d28d9,#e0307a)}
.vt{background:linear-gradient(135deg,#2a1260,#c0227a)}
.vt.kr{background:linear-gradient(135deg,#1b1240,#3b2a7a)}
.toast{background:#1b1033}
.bar:not(.g) i{background:linear-gradient(90deg,#6d28d9,#e0307a)}
/* Revisi: gradien biru ke ungu */
:root{--bg:#f2f4fc;--ink:#121638;--muted:#5d6490;--line:#dde1f3;--red:#6d28d9;--red-d:#5b21b6;--red-soft:#ede5fc;--blue:#1d4ed8;--blue-soft:#e1ebfd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c26;--surface:#151833;--ink:#f2f4ff;--muted:#a9b0d6;--line:#2a2f5c;--red:#a78bfa;--red-d:#8b5cf6;--red-soft:#251a52;--blue:#7fb0ff;--blue-soft:#172a4d}}
:root[data-theme="dark"]{--bg:#0b0c26;--surface:#151833;--ink:#f2f4ff;--muted:#a9b0d6;--line:#2a2f5c;--red:#a78bfa;--red-d:#8b5cf6;--red-soft:#251a52;--blue:#7fb0ff;--blue-soft:#172a4d}
.btn,.btn:hover,.seg button.on{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff}
.brand i{background:linear-gradient(135deg,#2563eb,#7c3aed)}
.vt{background:linear-gradient(135deg,#1e3a8a,#6d28d9)}
.vt.kr{background:linear-gradient(135deg,#0f1b3d,#2a2a6e)}
.toast{background:#121638}
.bar:not(.g) i{background:linear-gradient(90deg,#2563eb,#7c3aed)}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.78);z-index:50;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;width:100%;margin:8vh auto 0}
.cin{max-width:860px;margin:0 auto}
.cacts{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.cert{background:#fffdf8;color:#121638;border:10px solid #2a3a9a;outline:2px solid #b9a7f5;outline-offset:-18px;text-align:center;padding:44px 28px;aspect-ratio:1.414/1;min-height:340px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.cert .o{font-weight:700;font-size:14px;color:#5b3fd0}
.cert h2{font-size:clamp(24px,5vw,38px);color:#2a3a9a}
.cert p{margin:0}
.cert .n{font-weight:700;font-size:clamp(22px,5vw,38px);border-bottom:2px solid #b9a7f5;align-self:center;padding:2px 20px;margin:6px 0;overflow-wrap:anywhere}
.cert .f{font-size:13px;color:#5d6490;margin-top:14px}
@media print{.top,.shell,.toast,#gate,.cacts{display:none!important}#cov{position:static;background:none;padding:0}}
</style>
</head>

function aRingkas(){
  var P=allP(),N=P.length,done=0,run=0,idle=0,groups={},keys=[],i,v,raw,key,g;

    v=rkVal(P[i]);

    raw=String(unitOf(P[i])||"").replace(/\s+/g," ").trim();
    key="k:"+raw.toLowerCase();
    g=groups[key];
    if(!g){g=groups[key]={label:raw||"Belum diisi",empty:!raw,n:0,done:0,sum:0,vc:{},vbest:0};keys.push(key)}
    if(raw){var vk="v:"+raw;g.vc[vk]=(g.vc[vk]||0)+1;if(g.vc[vk]>g.vbest){g.vbest=g.vc[vk];g.label=raw}}
    g.n++;if(v>=100)g.done++;g.sum+=v
  }
  keys.sort(function(a,b){var x=groups[a],y=groups[b];if(x.empty!==y.empty)return x.empty?1:-1;return y.done-x.done||(y.done/y.n-x.done/x.n)||y.n-x.n||(x.label<y.label?-1:x.label>y.label?1:0)});
  var topDone=0;keys.forEach(function(k){if(!groups[k].empty&&groups[k].done>topDone)topDone=groups[k].done});
  var T=S.reviews||[],cnt={},known={},short=0,orphan=0;
  for(i=0;i<S.skills.length;i++)known["s:"+S.skills[i].id]=1;
  for(i=0;i<T.length;i++){
    key="s:"+T[i].sk;cnt[key]=(cnt[key]||0)+1;
    if(!known[key])orphan++;
    if(String(T[i].text||"").trim().length<30)short++
  }
  var unitRows=keys.map(function(k){var x=groups[k],avg=Math.round(x.sum/x.n),top=topDone>0&&!x.empty&&x.done===topDone;return'<tr><td><b>'+esc(x.label)+'</b>'+(top?' <span class="pill p-g">Paling banyak selesai</span>':'')+'</td><td>'+x.n+'</td><td>'+x.done+' ('+Math.round(x.done/x.n*100)+'%)</td><td style="min-width:150px">'+avg+'%'+bar(avg)+'</td></tr>'}).join("");
  var funnel=S.skills.map(function(x){
    var c=S.dones?(S.dones[x.id]||0):(cnt["s:"+x.id]||0),pc=N>0?Math.min(100,Math.round(c/N*100)):0;
    return'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600"><span>'+esc(x.name)+'</span><span>'+esc(N>0?rkRaw(c,N):"Belum ada data")+(N>0&&c>N?' <span class="pill p-r">melebihi jumlah peserta</span>':'')+'</span></div>'+(N>0?bar(pc):'')+'</div>'
  }).join("");
  return'<h1>Ringkasan admin</h1><p class="sub">Dasbor evaluasi berdasar New World Kirkpatrick Model. Metrik operasional bukan hasil belajar. '+(API?"Data dari Google Sheets.":"Mode demo: peserta selain Peserta Demo adalah data contoh.")+'</p>'+
  rkHead("Penyelesaian peserta","Operasional")+
  '<div class="grid4">'+rkCard("Completion rate",done,N,"Peserta yang semua skillnya selesai.")+rkCard("Selesai",done,N,"Progres 100%.")+rkCard("Sedang berjalan",run,N,"Progres 1% sampai 99%.")+rkCard("Belum mulai",idle,N,"Progres 0%.")+'</div>'+
  '<div class="card tb" style="margin-bottom:16px">'+rkHead("Per bisnis unit","Operasional")+(N>0?'<p class="sub" style="margin:0 0 10px">'+(topDone>0?'Diurutkan dari unit dengan peserta selesai terbanyak.':'Belum ada peserta yang menyelesaikan semua skill.')+'</p>':'')+(N>0?'<table><thead><tr><th>Unit</th><th>Jumlah peserta</th><th>Selesai (orang, %)</th><th>Rata-rata progres</th></tr></thead><tbody>'+unitRows+'</tbody></table>':'<p style="color:var(--muted)">Belum ada data</p>')+'</div>'+
  aExtra()+
  '<div class="card" style="margin-bottom:16px">'+rkHead("Corong per skill","Operasional (penyelesaian)")+(S.skills.length?funnel:'<p style="color:var(--muted)">Belum ada skill</p>')+'<small style="color:var(--muted);display:block">Dihitung dari peserta yang videonya sudah ditandai selesai (setelah memberi rating). Skill yang sudah dihapus tidak ikut dihitung.</small></div>'+
  '<div class="card" style="margin-bottom:12px"><b>Level 3 dan Level 4:</b> Level 3 (perilaku) dan Level 4 (hasil) tidak bisa diukur otomatis dari aplikasi. Nilai manual oleh mentor beberapa minggu setelah peserta selesai.</div>'+
  '<div class="card"><small style="color:var(--muted)"><b>Catatan metodologi.</b> Progres dihitung dari jumlah skill saat ini. Menambah skill menurunkan persentase peserta lama.</small></div>';

      S.qs[skid]=JSON.parse(JSON.stringify(QS));S.qc[skid]=QS.length;save();toast("Soal tersimpan ("+r.count+").");rerender()});
    return}
  if(f.id==="gform"){doRegister(f);return}if(f.id==="agate"){doAdmin(f);return}
  if(f.id==="tform"){
    var id=+f.dataset.id,fd=new FormData(f),text=String(fd.get("text")||"").trim();
    if(needTest(id)&&!(tres(id,"pre")&&tres(id,"post"))){toast("Kerjakan pre-test dan post-test dulu.");return}
    if(!fd.get("watched")){toast("Centang dulu bahwa kamu sudah menonton.");return}
    if(text.length<10){toast("Tulis satu kalimat takeaway, minimal 10 karakter.");return}
    S.progress[id]={done:true,text:text};
    if(!ME){toast("Daftar dulu.");return}
    S.pending[id]=true;save();
    api({action:"saveProgress",email:ME.email,skillId:id,done:true,text:text}).then(function(r){
      if(r.ok||r.offline){delete S.pending[id];save();toast("Tersimpan.")}else toast("Tersimpan di perangkat, belum terkirim. Akan dicoba lagi.")});
    var sx=sk(id);go(sx&&secList().length?"p-sec-"+skSec(sx):"p-beranda");return;
  }
  if(f.id==="uform"){
    var un=cleanUnit(new FormData(f).get("unit")),UA=unitList();
    if(!un){toast("Tulis nama bisnis unit dulu.");return}
    if(un.toLowerCase()==="lainnya"){toast("Nama \"Lainnya\" sudah tersedia otomatis.");return}
    if(UA.some(function(o){return o.toLowerCase()===un.toLowerCase()})){toast("Unit itu sudah ada di daftar.");return}
    if(!S.skills.length){toast("Tambah minimal satu skill dulu supaya daftar unit bisa disimpan.");return}
    UA.push(un);setUnits(UA);refreshUnitGate();rerender();toast("Unit ditambahkan: "+un);return}
  if(f.id==="pform"){if(API){toast("Peserta mendaftar sendiri lewat halaman peserta.");return}var d=new FormData(f);S.participants.push({name:String(d.get("name")).trim(),unit:String(d.get("unit")||""),pct:0});save();rerender();toast("Peserta ditambahkan.");return}
  if(f.id==="dform"){
    var dd=new FormData(f),dys=parseInt(String(dd.get("days")||""),10),dts=String(dd.get("date")||"").trim();
    if(!(dys>=1&&dys<=365)){toast("Isi jumlah hari antara 1 sampai 365.");return}
    if(dts&&!validDate(dts)){toast("Tanggal tidak valid.");return}
    S.skills.forEach(function(x){x.dl={days:dys,date:dts}});
    save();pushSkills();rerender();toast("Batas waktu disimpan.");return;
  }
  if(f.id==="vidform"){
    var vsid=+f.dataset.id,vids=new FormData(f).getAll("v").map(Number);
    S.skills.forEach(function(x){if(vids.indexOf(x.id)>=0)x.sec=vsid;else if(skSec(x)===vsid)x.sec=0});
    editingVid=null;save();pushSkills();rerender();toast("Video di bagian ini disimpan ("+vids.length+").");return;
  }
  if(f.id==="secform"){
    var sd=new FormData(f),sn=String(sd.get("name")||"").trim().slice(0,60),sds=String(sd.get("desc")||"").trim().slice(0,140);
    if(!sn){toast("Isi nama bagian.");return}
    var cs=editingSec===0?null:secOf(editingSec);
    if(cs){cs.name=sn;cs.desc=sds}else S.sections.push({id:Math.max.apply(null,S.sections.map(function(x){return x.id}).concat([0]))+1,name:sn,desc:sds});
    editingSec=null;save();pushSecs();rerender();toast("Bagian disimpan.");return;
  }
  if(f.id==="sform"){
    var q=new FormData(f),u=String(q.get("u")).trim(),dur=String(q.get("dur")).trim();
    if(u&&!/^https:\/\//i.test(u)){toast("Tautan harus diawali https://");return}
    if(dur&&!/^\d{1,2}:\d{2}$/.test(dur)){toast("Durasi harus berformat menit:detik, misalnya 7:30.");return}
    var bad="",alt=[];
    String(q.get("alt")||"").split("\n").forEach(function(line){line=line.trim();if(!line||bad)return;var a=line.split("|").map(function(x){return x.trim()});if(a.length<3||!/^https:\/\//i.test(a[1])){bad="Alternatif harus berformat: judul | tautan https | durasi.";return}alt.push({t:a[0],u:a[1],dur:a[2]})});
    if(bad){toast(bad);return}
    var obj={sec:+q.get("sec")||0,name:String(q.get("name")).trim(),desc:String(q.get("desc")||"").trim().slice(0,140),type:String(q.get("type")),vt:String(q.get("vt")).trim(),u:u,dur:dur,src:String(q.get("src")),dv:!!q.get("dv"),note:String(q.get("note")||"").trim(),sess:String(q.get("sess")||"").split("\n").map(function(x){return x.trim()}).filter(Boolean),alt:alt};
    var cur=editing===0?null:sk(editing);
    if(cur){for(var k in obj)cur[k]=obj[k]}else{obj.id=Math.max.apply(null,S.skills.map(function(x){return x.id}).concat([0]))+1;obj.ord=S.skills.length+1;obj.dl=dlCfg();obj.units=unitList();S.skills.push(obj)}
    editing=null;save();pushSkills();rerender();toast("Skill disimpan.");return;
  }
});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains("vt"))t.remove()},true);
window.addEventListener("hashchange",route);
route();
if(API){
  api({action:"getSkills"}).then(function(r){if(r.ok&&r.skills&&r.skills.length){S.skills=orderSkills(r.skills);S.sections=Array.isArray(r.sections)?r.sections:[];if(r.qc)S.qc=r.qc;LOADED=true;save();refreshUnitGate();rerender();maybeSeed()}});
  if(ME)api({action:"register",name:ME.unit?ME.name+" ["+ME.unit+"]":ME.name,email:ME.email}).then(function(r){if(r.ok){mergeServer(r);save();rerender();flush()}});
}
document.getElementById("gunit").innerHTML=unitField("Bisnis unit",true);
try{var pf=localStorage.getItem("magna-prefill");if(pf){localStorage.removeItem("magna-prefill");if(!ME){pf=JSON.parse(pf);var gf=document.getElementById("gform");gf.elements.name.value=pf.name||"";gf.elements.email.value=pf.email||"";unitSet(gf,pf.unit);doRegister(gf)}}}catch(e){}
})();
</script>
</body>
</html>
