<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magna EduSite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Mulish:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0c26;--s:#151833;--l:#2a2f5c;--ink:#f2f4ff;--mut:#a9b0d6;--hi:#c9b8ff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Mulish,system-ui,sans-serif}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;line-height:1.15;margin:0}a{color:inherit}img{max-width:100%;display:block}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(11,12,38,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--l)}
header .w{display:flex;align-items:center;gap:20px;height:68px}header img{height:34px;width:auto}
nav{display:flex;gap:22px;margin-left:auto;font-weight:600;font-size:15px}nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--ink)}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:12px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border:0}
.btn:hover{filter:brightness(1.12)}.btn.o{background:transparent;border:1.5px solid var(--hi);color:var(--hi)}.btn.o:hover{background:rgba(201,184,255,.1)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.hero{padding:72px 0 64px;background:radial-gradient(900px 420px at 80% -10%,rgba(124,58,237,.28),transparent 70%)}
.hero .w{display:grid;grid-template-columns:1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800}.hero h1 em{font-style:normal;color:var(--hi)}
.hero p{color:var(--mut);font-size:19px;margin:20px 0 28px;max-width:34em}.row{display:flex;gap:14px;flex-wrap:wrap}
.stat{background:var(--s);border:1px solid var(--l);border-radius:20px;padding:26px}.stat b{font:800 44px Montserrat,sans-serif;color:var(--hi);display:block}.stat span{color:var(--mut)}
.stat div+div{margin-top:18px;padding-top:18px;border-top:1px solid var(--l)}.stat small{display:block;margin-top:16px;color:var(--mut);font-size:13px}
section{padding:64px 0}section h2{font-size:clamp(26px,3.6vw,36px);font-weight:800;margin-bottom:10px}.sub{color:var(--mut);max-width:40em;margin:0 0 32px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.c{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:22px}.c h3{font-size:18px;margin-bottom:8px}.c p{margin:0;color:var(--mut);font-size:15.5px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:0;list-style:none;margin:0}
.steps li{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:22px 22px 22px 22px}.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);font:800 16px Montserrat,sans-serif;margin-bottom:12px}
.steps b{display:block;margin-bottom:4px;font-family:Montserrat,sans-serif}.steps span{color:var(--mut);font-size:15.5px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ph img{width:100%;border-radius:16px;border:1px solid var(--l);object-fit:cover}.ph .big{grid-column:1/-1;aspect-ratio:16/8}.ph .sm{aspect-ratio:4/4.4}
.rem{margin:20px 0 0;padding:16px 20px;border:1px solid var(--l);border-left:4px solid var(--hi);border-radius:12px;background:var(--s);color:var(--mut);font-size:15.5px}.rem b{color:var(--ink)}.l{margin:10px 0 0;padding-left:20px;color:var(--mut);font-size:15.5px}.l li{margin-bottom:4px}
.cta{text-align:center;background:linear-gradient(135deg,rgba(37,99,235,.28),rgba(124,58,237,.28));border:1px solid var(--l);border-radius:24px;padding:48px 24px}.cta p{color:var(--mut);margin:10px auto 24px;max-width:32em}
footer{border-top:1px solid var(--l);padding:32px 0;color:var(--mut);font-size:15px}footer .w{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}footer img{height:30px;width:auto}
@media(max-width:820px){.hero .w{grid-template-columns:1fr}nav{display:none}header .btn{margin-left:auto;padding:10px 16px}.hero{padding-top:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.login{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:32px 20px;background:radial-gradient(900px 420px at 80% -10%,rgba(124,58,237,.28),transparent 70%)}
.lbox{background:var(--s);border:1px solid var(--l);border-radius:18px;padding:28px;max-width:440px;width:100%}
.lbox h1{font-size:28px;font-weight:800;margin-bottom:6px}.lbox h1 em{font-style:normal;color:var(--hi)}
.lbox p{color:var(--mut);margin:0 0 18px;font-size:15px}
.lbox label{display:block;font-weight:700;font-size:13px;margin-bottom:14px}
.lbox select,.lbox input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.lbox select:focus-visible,.lbox input:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.lbox button.btn{width:100%;cursor:pointer;font:inherit;font-weight:700}
.msg{color:#ffb4b4;font-size:14px;min-height:20px;margin:-4px 0 10px}
</style>
</head>

<main class="login"><form class="lbox" id="f" novalidate>
<h1>Boost your <em>skill</em> here</h1>
<p>Isi nama, email, dan bisnis unitmu untuk mulai belajar. Progresmu disimpan berdasarkan email.</p>
<label>Nama lengkap<input name="name" required maxlength="80" autocomplete="name"></label>
<label>Email<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
<div id="gunit"></div>
<div class="msg" id="msg" role="alert"></div>
<button class="btn" type="submit">Mulai belajar</button>
</form></main>
<script>
var UNITS=["Magna Partners (inti)", "LinkToWork", "AfterGrads", "CompetitionRealms", "Indonesia Organizations Chamber (IOC)", "TechFusion", "BluScape", "Samarthana", "College Copilot", "Pathseeker", "Economic Space", "Lainnya"];
function unitField(label,req){var o='<option value="">Pilih bisnis unit</option>'+UNITS.filter(function(u){return u!=="Lainnya"}).map(function(u){return'<option>'+u+'</option>'}).join("")+'<option value="__o">Lainnya (tulis sendiri)</option>';return'<label class="f">'+label+'<select class="usel"'+(req?' required':'')+'>'+o+'</select><input name="unit" class="uoth" maxlength="60" autocomplete="off" placeholder="Tulis bisnis unit" hidden></label>'}
function unitSet(f,v){var s=f.querySelector(".usel"),i=f.querySelector(".uoth");if(!s||!i)return;v=String(v||"").trim();var m="";UNITS.forEach(function(u){if(u.toLowerCase()===v.toLowerCase())m=u});if(m||!v){s.value=m;i.value=m;i.hidden=true}else{s.value="__o";i.value=v;i.hidden=false}}
document.addEventListener("change",function(e){var s=e.target;if(!s.classList||!s.classList.contains("usel"))return;var i=s.parentNode.querySelector(".uoth");if(s.value==="__o"){i.value="";i.hidden=false;i.focus()}else{i.value=s.value;i.hidden=true}});
document.getElementById("gunit").innerHTML=unitField("Bisnis unit",true);
(function(){
var f=document.getElementById("f"),m=document.getElementById("msg");
try{var me=JSON.parse(localStorage.getItem("magna-me")||"null");if(me){f.name.value=me.name||"";f.email.value=me.email||"";unitSet(f,me.unit)}}catch(e){}
f.addEventListener("submit",function(e){
  e.preventDefault();
  var n=f.name.value.trim(),em=f.email.value.trim().toLowerCase(),un=f.unit.value.replace(/[\[\]]/g," ").replace(/\s+/g," ").trim().slice(0,60);
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.textContent="Isi nama dan email dengan benar.";return}
  if(!un){m.textContent="Isi bisnis unitmu.";return}
  try{localStorage.setItem("magna-prefill",JSON.stringify({name:n,email:em,unit:un}))}catch(x){}
  location.href="app.html";
});
})();
</script>
